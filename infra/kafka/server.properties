# Single-node Apache Kafka 3.7.2 in KRaft mode (no ZooKeeper) for LOCAL REPLAY ONLY.
# Plaintext, no authentication, bound to localhost. Not a production configuration.
# Data directory is rewritten at start time by scripts/local_kafka.py (default: data/kafka_data on D:).
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:29093
listeners=PLAINTEXT://127.0.0.1:29092,CONTROLLER://127.0.0.1:29093
advertised.listeners=PLAINTEXT://127.0.0.1:29092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=false
log.dirs=__SET_BY_LOCAL_KAFKA_PY__
# Kafka's segment deletion is unreliable on Windows (open file handles); keep retention long
# for a bounded replay and avoid background deletion during tests.
log.retention.hours=168
log.segment.bytes=104857600
log.cleaner.enable=false
group.initial.rebalance.delay.ms=0
# Deleting a topic renames its directory while the broker still holds segment files open; on Windows
# that rename fails (AccessDeniedException), the only log dir is marked failed and the broker shuts
# down. Refuse deletions instead; tests/benchmarks use fresh, uniquely named topics and leave them.
delete.topic.enable=false
